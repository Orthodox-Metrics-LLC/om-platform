[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "om-viewer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "PyMySQL>=1.1.2,<2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
desktop = ["pyinstaller>=6.16,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
om_viewer = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
