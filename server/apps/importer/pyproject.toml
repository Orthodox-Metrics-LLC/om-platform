[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "om-importer"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "python-docx==1.2.0", "jsonschema==4.26.0", "PyMySQL>=1.1.2,<2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
desktop = ["pyinstaller>=6.16,<7"]

[project.scripts]
om-importer = "om_importer.cli:main"

[tool.setuptools.package-data]
om_importer = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
