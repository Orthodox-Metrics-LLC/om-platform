<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Orthodox Metrics Internal Docs</title>
  <link rel="icon" href="/docs/internal/assets/images/favicon.png">
  <style>
    :root {
      --om-navy: #1a2744;
      --om-gold: #c9a227;
      --om-text: #e8ecf4;
      --om-muted: #9aa8c4;
      --om-card: #243352;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, var(--om-navy) 0%, #0f1829 100%);
      color: var(--om-text);
      padding: 1.5rem;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: var(--om-card);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .logo {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--om-gold);
      margin-bottom: 0.5rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.3;
    }
    p {
      margin: 0 0 1.75rem;
      color: var(--om-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.85rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--om-navy);
      background: var(--om-gold);
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--om-muted);
    }
    .footer a { color: var(--om-gold); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Orthodox Metrics</div>
    <h1>Internal Documentation</h1>
    <p>Engineering and operations documentation for authenticated OM team members.</p>
    <a id="signin-btn" class="btn" href="/auth/login2">Sign in to continue</a>
    <p class="footer">
      <a href="/docs/">Public documentation</a>
    </p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var ret = params.get('return') || '/docs/internal/';
      if (!ret.startsWith('/') || ret.startsWith('//') || ret.indexOf('://') !== -1) {
        ret = '/docs/internal/';
      }
      document.getElementById('signin-btn').href =
        '/auth/login2?redirect=' + encodeURIComponent(ret);
    })();
  </script>
</body>
</html>
