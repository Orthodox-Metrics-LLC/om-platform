# OM Viewer desktop update feeds (0.2.2+).
# Public HTTPS downloads. No website login, no SPA fallback, no directory listing.
# Include inside the orthodoxmetrics.com HTTPS server. The publisher is
# scripts/server/ops/publish-om-viewer-release.py.

location @om_viewer_update_miss {
    internal;
    default_type text/plain;
    return 404 "not found\n";
}

location ^~ /updates/om-viewer/ {
    alias /var/www/orthodoxmetrics-updates/om-viewer/;
    autoindex off;
    auth_basic off;
    default_type application/octet-stream;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # A missing file must stay a real 404 so the desktop updater does not
    # follow an HTML page. Defining error_page here blocks inheritance, so
    # the custom 403 page has to be named again. Directory URLs are forbidden.
    error_page 403 = @om_error_403;
    error_page 404 = @om_viewer_update_miss;
    error_page 500 = @om_error_500;
    location ~ /\. { deny all; }
    limit_except GET HEAD { deny all; }
}
