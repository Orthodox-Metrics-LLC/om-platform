# OM Viewer desktop update feeds.
# Public HTTPS downloads. No website login, no SPA fallback, no directory listing.
# Publish with scripts/server/ops/publish-om-viewer-update.sh (release account only).

location @om_viewer_update_miss {
    internal;
    default_type text/plain;
    return 404 "not found\n";
}

location ^~ /updates/om-viewer/windows/x64/ {
    alias /var/www/orthodoxmetrics-updates/om-viewer/windows/x64/;
    autoindex off;
    default_type application/octet-stream;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # A missing file must stay a real 404. The server-level error_page would
    # otherwise turn it into the maintenance page or a redirect to the website.
    error_page 404 = @om_viewer_update_miss;
    limit_except GET HEAD { deny all; }
}

location ^~ /updates/om-viewer/linux/x64/ {
    alias /var/www/orthodoxmetrics-updates/om-viewer/linux/x64/;
    autoindex off;
    default_type application/octet-stream;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    error_page 404 = @om_viewer_update_miss;
    limit_except GET HEAD { deny all; }
}
