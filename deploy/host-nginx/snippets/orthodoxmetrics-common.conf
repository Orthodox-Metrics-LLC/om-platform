    proxy_set_header   X-Forwarded-Proto https;
    proxy_hide_header  X-Frame-Options;
    include            /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    proxy_set_header   Accept-Encoding "";
    sub_filter_once    off;
    sub_filter_types   text/html;
    sub_filter         'src="/assets/' 'src="/omstudio-embed/assets/';
    sub_filter         'href="/assets/' 'href="/omstudio-embed/assets/';
    sub_filter         'href="/favicon.svg"' 'href="/omstudio-embed/favicon.svg"';
