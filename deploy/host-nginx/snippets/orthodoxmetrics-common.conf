# ---------- OMAI realm-aware path routing ----------
  include /etc/nginx/snippets/omai-realm-paths.conf;

# ---------- Backend API (catch-all → OM backend port 3001) ----------
location /api/ {
    proxy_pass         http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    # X-Build-Type now computed locally from the user_role cookie (was set by .221 edge)
    proxy_set_header   X-Build-Type $om_build_type;
    proxy_buffering    off;
    client_max_body_size 512M;
    proxy_set_header   Cookie $http_cookie;
    proxy_pass_header  Set-Cookie;
    proxy_cookie_path  / /;
    proxy_cookie_domain 127.0.0.1 orthodoxmetrics.com;
    proxy_cookie_domain localhost orthodoxmetrics.com;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;
    proxy_intercept_errors off;
    # OM-CONTRACT-0024 §5.1/§5.2 — context envelope headers appended; expose headers added
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,x-context-session-id,x-correlation-id,x-request-id,x-source-app,x-source-route,x-work-item-id" always;
    add_header Access-Control-Expose-Headers "x-context-session-id, x-correlation-id, x-request-id" always;

    # OM-CONTRACT-0024 §5.3 — preflight MUST reflect $http_origin (never "*") when credentials are true
    if ($request_method = OPTIONS) {
        include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,x-context-session-id,x-correlation-id,x-request-id,x-source-app,x-source-route,x-work-item-id";
        add_header Access-Control-Expose-Headers "x-context-session-id, x-correlation-id, x-request-id";
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Content-Length 0;
        return 204;
    }
}

# ---------- Church Branding Assets ----------
location ^~ /church-branding/ {
    alias /var/www/orthodoxmetrics/prod/server/storage/church-branding/;
    expires 1h;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public";
}

# ---------- Public/Uploads ----------
location ^~ /uploads/ {
    alias /var/www/orthodoxmetrics/prod/uploads/;
    expires 1h;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public";
}

location /public/ {
    alias /var/www/orthodoxmetrics/prod/public/;
    expires 1h;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public";
}

# ---------- Security: hide dotfiles & sensitive extensions ----------
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
location ~ \.(sql|log)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# ---------- Compression ----------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

client_max_body_size 512M;
