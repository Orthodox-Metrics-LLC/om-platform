# ---------- om-platform (new public marketing site) ----------
# 2026-09-16 hostname split: this vhost is om-platform for ALL frontend
# routes, including `location /`. The old authenticated SPA is only on
# prod.orthodoxmetrics.com. APIs/sockets still proxy to orthodox-backend.
#
# om-platform's assets are namespaced under /om-platform/ because both apps build
# bundles to /assets/index-*.js and both ship public images under
# /assets/images/ — at one origin those paths are otherwise ambiguous and one
# app would receive the other's bundles.
#
# /auth/login on this host is om-platform sign-in. The real OM app login is
# https://prod.orthodoxmetrics.com/auth/login (legacy SPA).
# The subdirectories below hold STABLE, unhashed filenames copied verbatim
# from front-end/public/ (images, icons, illustrations, background, video,
# logo, fonts) -- Vite does not content-hash them. They must NOT be marked
# immutable, or a changed image at the same filename is cached forever and
# never revalidated. These `^~` blocks are longer prefixes than the general
# /om-platform/ block below, so nginx prefers them for anything under them.
location ^~ /om-platform/assets/images/ {
    alias /var/www/om-platform/front-end/dist/assets/images/;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
    try_files $uri =404;
}
location ^~ /om-platform/assets/icons/ {
    alias /var/www/om-platform/front-end/dist/assets/icons/;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
    try_files $uri =404;
}
location ^~ /om-platform/assets/illustrations/ {
    alias /var/www/om-platform/front-end/dist/assets/illustrations/;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
    try_files $uri =404;
}
location ^~ /om-platform/assets/background/ {
    alias /var/www/om-platform/front-end/dist/assets/background/;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
    try_files $uri =404;
}
location ^~ /om-platform/assets/video/ {
    alias /var/www/om-platform/front-end/dist/assets/video/;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
    try_files $uri =404;
}
location ^~ /om-platform/logo/ {
    alias /var/www/om-platform/front-end/dist/logo/;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /om-platform/favicon.ico {
    alias /var/www/om-platform/front-end/dist/favicon.ico;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
}
location = /om-platform/apple-touch-icon.png {
    alias /var/www/om-platform/front-end/dist/apple-touch-icon.png;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
}

location ^~ /om-platform/ {
    alias /var/www/om-platform/front-end/dist/;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Marketing routes served by om-platform's index.html (client-side routed).
location ~ ^/(product|products|records|capabilities|ocr|analytics|about|about-us|contact|contact-us|faq|faqs|pricing|enroll|latest-news|terms|privacy|security)$ {
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    root /var/www/om-platform/front-end/dist;
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
}

# Site root.
location = / {
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    root /var/www/om-platform/front-end/dist;
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
}

# ---------- SPA entry ----------
location / {
    try_files $uri $uri/ /index.html;
}

# ---------- Static assets (JS/CSS with cache-busting) ----------
location ~* \.(js|css)$ {
    expires 1y;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# ---------- Public images (stable filenames → must revalidate) ----------
# Files under /images come from front-end/public/ and keep STABLE names
# (Vite copies them verbatim, no content hash), so they MUST NOT be served
# `immutable`. When an image changes content under the same name, an
# immutable copy pins every browser to the stale image for up to a year
# (Chrome/Edge honor `immutable` even on Ctrl+Shift+R). `no-cache` keeps the
# file cacheable but forces a conditional revalidation each load, so a
# changed image is picked up immediately (304 when unchanged). The ^~ prefix
# wins over the generic image-extension regex below.
location ^~ /images/ {
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, no-cache, must-revalidate" always;
    try_files $uri =404;
}

# ---------- Images and fonts ----------
location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}


# ---------- Build metadata from backend ----------
location = /build.meta.json {
    proxy_pass         http://127.0.0.1:3001/build.meta.json;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# ---------- WebSocket: OMAI Logger ----------
location /ws/omai-logger {
    proxy_pass         http://127.0.0.1:3001/ws/omai-logger;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_connect_timeout 7d;
    proxy_send_timeout    7d;
    proxy_read_timeout    7d;
}

# ---------- Socket.IO ----------
location /socket.io/ {
    proxy_pass         http://127.0.0.1:3001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Cookie $http_cookie;
    proxy_pass_header  Set-Cookie;
    proxy_cookie_path  / /;
    proxy_connect_timeout 7d;
    proxy_send_timeout    7d;
    proxy_read_timeout    7d;
}

# ---------- GitHub Webhooks ----------
location /webhooks/ {
    proxy_pass         http://127.0.0.1:3001/webhooks/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Content-Type $content_type;
    proxy_pass_request_body on;
}

# ---------- OMAI Service ----------
# When berry/.building exists (omai-deploy / vite build), serve the OMAI
# updating page instead of proxying to Express — avoids plain
# "Cannot GET /omai/" while dist is missing or the service is restarting.
location ^~ /omai/ {
    if (-f /var/www/omai/berry/.building) {
        return 503;
    }

    proxy_pass         http://127.0.0.1:7060/omai/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_buffering    off;
    proxy_read_timeout 30s;

    # Upstream 503 (Express maintenance) and gateway errors → updating page.
    error_page 502 503 504 =503 @omai_updating;
}
location @omai_updating {
    root /var/www/html;
    rewrite ^(.*)$ /omai-updating.html break;
}

# ---------- Migrated API routes → OMAI (port 7060) ----------
# All /api/omai/* belongs to OMAI. OMAI's omai router is a superset of
# OM's, plus extras like conversation-ledger, public-tokens, task-history.
# Must come BEFORE the catch-all /api/ block to win prefix matching.
location ^~ /api/omai/ {
    proxy_pass         http://127.0.0.1:7060/api/omai/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_buffering    off;
    proxy_set_header   Cookie $http_cookie;
    proxy_pass_header  Set-Cookie;
    proxy_cookie_path  / /;
    proxy_cookie_domain 127.0.0.1 orthodoxmetrics.com;
    proxy_cookie_domain localhost orthodoxmetrics.com;
    client_max_body_size 50M;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
}

