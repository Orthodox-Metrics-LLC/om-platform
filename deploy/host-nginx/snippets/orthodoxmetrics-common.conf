location ^~ /api/brain/ {
    proxy_intercept_errors off;
    proxy_pass         http://127.0.0.1:7060/api/brain/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_buffering    off;
    proxy_set_header   Cookie $http_cookie;
    proxy_pass_header  Set-Cookie;
    proxy_cookie_path  / /;
    proxy_cookie_domain 127.0.0.1 orthodoxmetrics.com;
    proxy_cookie_domain localhost orthodoxmetrics.com;
    client_max_body_size 50M;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # OM-CONTRACT-0024 §5.1/§5.2/§5.3 — context envelope CORS boundary for /api/brain/
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,x-context-session-id,x-correlation-id,x-request-id,x-source-app,x-source-route,x-work-item-id" always;
    add_header Access-Control-Expose-Headers "x-context-session-id, x-correlation-id, x-request-id" always;

    if ($request_method = OPTIONS) {
        include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,x-context-session-id,x-correlation-id,x-request-id,x-source-app,x-source-route,x-work-item-id";
        add_header Access-Control-Expose-Headers "x-context-session-id, x-correlation-id, x-request-id";
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Content-Length 0;
        return 204;
    }
}

