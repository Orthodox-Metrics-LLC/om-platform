# /etc/nginx/snippets/orthodoxmetrics-common.conf
# Shared location/serving logic for orthodoxmetrics.com on .239.
# 2026-09-16: frontend root is om-platform/front-end/dist.
# The legacy prod-current SPA lives at prod.orthodoxmetrics.com
# (orthodoxmetrics-legacy-common.conf). Do not fall through to
# prod/front-end/dist here — that would defeat the hostname split.
# Included from both the port-80 and port-443 server blocks.
# X-Build-Type and maintenance-bypass logic migrated from the retired .221 edge.

# ========== MAINTENANCE MODE CHECK ==========
set $maintenance_file /var/www/orthodoxmetrics/maintenance.on;
set $show_maint "N";
if (-f $maintenance_file) {
    set $show_maint "Y";
}
# Bypass via geo lookup — admin IPs in the maintenance_bypass block
# (defined in sites-enabled/orthodoxmetrics.com) can still hit the
# live site to verify a deploy from off-network.
if ($maintenance_bypass = "1") {
    set $show_maint "N";
}
# Bypass maintenance for OMAI requests so they do not show the OM maintenance page during OM deploys.
if ($uri ~* ^/(docs|omai|ws/omai-logger|api/(omai|omai-daily|platform|tutorials|analytics|architecture-audit|manual-prompts|work-timer|pr-board|brain|deploy-runs|auto-repair|ecosystem-config-registry|auth/oidc/omstudio|auth/sso|studio|realms|ssh-keys|devops))(/|$)) {
    set $show_maint "N";
}
# NOTE: the prior LAN bypass (192.168/10/127) was removed on 2026-05-03.
# It defeated the maintenance page for every operator running om-deploy
# from a LAN host, which made the page effectively invisible. Off-network
# verification now goes through the maintenance_bypass geo block above.
add_header X-Maint-Debug "$show_maint" always;
if ($show_maint = "Y") {
    rewrite ^(.*)$ /maintenance.html break;
}
# ========== END MAINTENANCE MODE ==========

root /var/www/om-platform/front-end/dist;
index index.html;

access_log /var/log/nginx/orthodoxmetrics.access.log;
error_log  /var/log/nginx/orthodoxmetrics.error.log;

# ---------- Security headers ----------
# NOTE: add_header does not inherit into any location block that declares
# its own add_header (e.g. Cache-Control, CORS) — so this same snippet is
# also `include`d directly inside every such location block below.
include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;

# ---------- Maintenance page ----------
# Direct serve from /var/www/html/. Both names route to the same file
# so any old links / bookmarks / scripts still resolve.
location = /maintenance.html {
    root /var/www/html;
}
location = /updating.html {
    root /var/www/html;
}
location = /omai-updating.html {
    root /var/www/html;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# ---------- No-cache for index.html ----------
# try_files falls back to =404 (not /index.html) so that when the
# dist is empty during a deploy, missing index.html surfaces as a
# 404 — which error_page 404 = @maint_or_404 catches and turns into
# the maintenance page. The previous /index.html fallback was
# self-referential and produced nginx 500 "rewrite or internal
# redirection cycle" errors during the deploy window.
include /etc/nginx/snippets/orthodoxmetrics-sso.conf;
include /etc/nginx/snippets/orthodoxmetrics-om-docs.conf;
# Portal2 removed 2026-07-21 — was orthodoxmetrics-customer-portal.conf

# Portal2 retired — return 404 (do not fall through to main SPA)
location = /portal2 { return 404; }
location ^~ /portal2/ { return 404; }


location = /index.html {
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

# ---------- No-cache for all other HTML files (except index.html) ----------
# Same =404 fallback rationale as the index.html block above — when
# /index.html is missing during a deploy, falling back to it would
# loop. Surfacing 404 lets error_page route to the maintenance page.
location ~* ^(?!/index\.html$).*\.html$ {
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

# ---------- Build info endpoint ----------
location = /build-info.json {
    expires off;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /build-info.json =404;
}

# ---------- Build-time fallback: serve updating page if dist is empty ----------
# 5xx → always show the maintenance page (matches existing behavior).
error_page 500 502 503 504 =503 @updating;
# 403/404 → conditional. The SPA's dist is briefly empty during a deploy
# (after `npm run build:clean`, before assets land), and try_files exits
# with 4xx rather than 5xx — so the unconditional @updating fallback above
# misses it. Route 4xx through @maint_or_404, which only serves the
# maintenance page when the deploy flag is set; otherwise it passes
# through as a real 404 so unrelated app 404s aren't masked.
error_page 403 404 = @maint_or_404;

location @updating {
    root /var/www/html;
    rewrite ^(.*)$ /maintenance.html break;
}

location @maint_or_404 {
    root /var/www/html;
    if (-f /var/www/orthodoxmetrics/maintenance.on) {
        rewrite ^(.*)$ /maintenance.html break;
    }
    return 404;
}

# ---------- OM Workshop embed (HTTPS same-origin iframe from OMAI CP) ----------
# Proxies the workshop SPA on 192.168.1.251 so /omai/cp/workshop can iframe
# without mixed content or X-Frame-Options blocking. Workshop JS calls
# /__server/* and /__webhook/* with root-absolute paths — those are proxied
# here too (OM prod does not use these prefixes).
location ^~ /workshop-embed/assets/ {
    proxy_pass         http://192.168.1.251/assets/;
    proxy_http_version 1.1;
    proxy_set_header   Host 192.168.1.251;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    expires            1y;
    include            /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header         Cache-Control "public, immutable";
}
location ^~ /workshop-embed/__server/ {
    proxy_pass         http://192.168.1.251/__server/;
    proxy_http_version 1.1;
    proxy_set_header   Host 192.168.1.251;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 600s;
}
location ^~ /workshop-embed/__webhook/ {
    proxy_pass         http://192.168.1.251/__webhook/;
    proxy_http_version 1.1;
    proxy_set_header   Host 192.168.1.251;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 600s;
}
location ^~ /workshop-embed/ {
    proxy_pass         http://192.168.1.251/;
    proxy_http_version 1.1;
    proxy_set_header   Host 192.168.1.251;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_hide_header  X-Frame-Options;
    include            /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    proxy_set_header   Accept-Encoding "";
    sub_filter_once    off;
    sub_filter_types   text/html;
    sub_filter         'src="/assets/' 'src="/workshop-embed/assets/';
    sub_filter         'href="/assets/' 'href="/workshop-embed/assets/';
    sub_filter         'href="/vite.svg"' 'href="/workshop-embed/vite.svg"';
}
location ^~ /__server/ {
    proxy_pass         http://192.168.1.251/__server/;
    proxy_http_version 1.1;
    proxy_set_header   Host 192.168.1.251;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 600s;
}
location ^~ /__webhook/ {
    proxy_pass         http://192.168.1.251/__webhook/;
    proxy_http_version 1.1;
    proxy_set_header   Host 192.168.1.251;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 600s;
}


# OMStudio SSO token exchange (mint studio JWT from Keycloak OIDC cookie).
location = /api/auth/sso-exchange {
    proxy_pass         http://192.168.1.242/api/auth/sso-exchange;
    proxy_http_version 1.1;
    proxy_set_header   Host 192.168.1.242;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Cookie $http_cookie;
    proxy_pass_header  Set-Cookie;
    proxy_read_timeout 60s;
}
# ---------- OMStudio embed (HTTPS same-origin iframe from OMAI CP) ----------
# Proxies the OMStudio SPA on 192.168.1.242 so /omai/cp/studio/* can iframe
