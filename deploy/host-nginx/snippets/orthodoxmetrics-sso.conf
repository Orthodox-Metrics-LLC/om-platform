# Enterprise SSO (Keycloak) — included from orthodoxmetrics-common.conf

location = /login {
    alias /var/www/omai/platform-login/index.html;
    default_type text/html;
    include /etc/nginx/snippets/orthodoxmetrics-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /api/auth/recaptcha-config {
    proxy_pass         http://127.0.0.1:7060/api/auth/recaptcha-config;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/auth/oidc/ {
    proxy_pass         http://127.0.0.1:7060/api/auth/oidc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_cookie_path / /;
}

location ^~ /api/auth/sso/ {
    proxy_pass         http://127.0.0.1:7060/api/auth/sso/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_cookie_path / /;
}
