<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orthodox Metrics</title>
    <meta
      name="description"
      content="Orthodox Metrics is a church records platform for baptism, marriage, and funeral recordkeeping, OCR digitization, and multilingual, Orthodox-canonical reporting."
    />

    <!-- Open Graph / Facebook, Messenger, Slack, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orthodox Metrics" />
    <meta property="og:title" content="Orthodox Metrics" />
    <meta
      property="og:description"
      content="Orthodox Metrics is a church records platform for baptism, marriage, and funeral recordkeeping, OCR digitization, and multilingual, Orthodox-canonical reporting."
    />
    <meta property="og:url" content="https://orthodoxmetrics.com/" />
    <meta
      property="og:image"
      content="https://orthodoxmetrics.com/om-platform/assets/images/social/om-og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orthodox Metrics" />
    <meta
      name="twitter:description"
      content="Orthodox Metrics is a church records platform for baptism, marriage, and funeral recordkeeping, OCR digitization, and multilingual, Orthodox-canonical reporting."
    />
    <meta
      name="twitter:image"
      content="https://orthodoxmetrics.com/om-platform/assets/images/social/om-og-image.png"
    />
  </head>

    <div id="root"></div>
